<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- City sky & buildings background -->
  <rect width="600" height="600" fill="#334155"/>
  <rect x="50" y="100" width="120" height="500" fill="#1e293b"/>
  <rect x="420" y="150" width="140" height="450" fill="#0f172a"/>
  <!-- Traffic Light Pole & Housing -->
  <rect x="275" y="50" width="50" height="550" fill="#0f172a"/>
  <g transform="translate(240, 120)">
    <!-- Housing Box -->
    <rect x="0" y="0" width="120" height="320" rx="20" fill="#1e293b" stroke="#0f172a" stroke-width="6"/>
    <!-- Red Light (Active) -->
    <circle cx="60" cy="65" r="30" fill="#ef4444"/>
    <circle cx="60" cy="65" r="30" fill="url(#redGlow)" opacity="0.6"/>
    <!-- Yellow Light (Off) -->
    <circle cx="60" cy="160" r="30" fill="#475569"/>
    <!-- Green Light (Off) -->
    <circle cx="60" cy="255" r="30" fill="#475569"/>
  </g>
</svg>

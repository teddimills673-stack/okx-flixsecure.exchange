  <g transform="translate(130, 310) scale(0.7)">
    <ellipse cx="200" cy="270" rx="150" ry="22" fill="rgba(0,0,0,0.5)"/>
    <circle cx="100" cy="240" r="42" fill="#090d16"/>
    <circle cx="100" cy="240" r="22" fill="#475569"/>
    <circle cx="300" cy="240" r="42" fill="#090d16"/>
    <circle cx="300" cy="240" r="22" fill="#475569"/>
    <path d="M40 210 Q70 140 130 130 L270 130 Q330 140 360 210 L380 245 L20 245 Z" fill="url(#silverCar)"/>
    <path d="M130 130 L165 85 L255 85 L285 130 Z" fill="#0f172a"/>
    <path d="M138 122 L170 92 L250 92 L277 122 Z" fill="#bae6fd" opacity="0.85"/>
  </g>

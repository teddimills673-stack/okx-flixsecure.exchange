<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Background / Sky -->
  <rect width="600" height="300" fill="url(#sky)"/>
  <!-- Horizon / Mountains -->
  <path d="M0 300 L120 220 L240 280 L380 200 L500 270 L600 230 L600 300 Z" fill="#475569"/>
  <!-- Highway Road -->
  <path d="M150 300 L450 300 L550 600 L50 600 Z" fill="url(#road)"/>
  <!-- Lane Markings -->
  <polygon points="295,300 305,300 315,600 285,600" fill="#f8fafc"/>
  <!-- Sedan Car on Highway -->
  <g transform="translate(180, 320) scale(0.65)">
    <!-- Car Shadow -->
    <ellipse cx="200" cy="270" rx="160" ry="25" fill="rgba(0,0,0,0.6)"/>
    <!-- Wheels -->
    <circle cx="110" cy="240" r="45" fill="#0f172a"/>
    <circle cx="110" cy="240" r="25" fill="#64748b"/>
    <circle cx="290" cy="240" r="45" fill="#0f172a"/>
    <circle cx="290" cy="240" r="25" fill="#64748b"/>
    <!-- Body -->
    <path d="M50 200 Q80 140 140 130 L260 130 Q330 140 350 200 L370 240 L30 240 Z" fill="url(#carBody)"/>
    <!-- Cabin Roof -->
    <path d="M130 130 L170 80 L250 80 L280 130 Z" fill="#1e293b"/>
    <!-- Windows -->
    <path d="M140 120 L175 90 L245 90 L270 120 Z" fill="#93c5fd" opacity="0.8"/>
    <!-- Headlights -->
    <rect x="345" y="210" width="15" height="15" rx="4" fill="#fef08a"/>
  </g>
</svg>

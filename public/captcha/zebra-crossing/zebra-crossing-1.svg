<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Street background -->
  <rect width="600" height="600" fill="#1e293b"/>
  <!-- Asphalt Road -->
  <rect y="150" width="600" height="450" fill="#0f172a"/>
  <!-- Zebra Crossing / Crosswalk stripes -->
  <g fill="#f8fafc">
    <rect x="80" y="220" width="50" height="300" transform="skewX(-25)" />
    <rect x="160" y="220" width="50" height="300" transform="skewX(-25)" />
    <rect x="240" y="220" width="50" height="300" transform="skewX(-25)" />
    <rect x="320" y="220" width="50" height="300" transform="skewX(-25)" />
    <rect x="400" y="220" width="50" height="300" transform="skewX(-25)" />
    <rect x="480" y="220" width="50" height="300" transform="skewX(-25)" />
  </g>
</svg>
